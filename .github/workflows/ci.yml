name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest
      - name: Compile Python sources
        run: uv run python -m compileall -q src tests