[project]
name = "indeed-job-parser"
version = "0.1.0"
description = "Configurable Indeed vacancy collector with SQLite persistence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-jobspy==1.1.82",
]

[project.scripts]
indeed-jobs = "indeed_job_parser.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/indeed_job_parser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
