[search]
country = "Czech Republic"
country_code = "CZ"
location = "Czechia"
queries = [
  "QA Engineer",
  "QA Automation Engineer",
  "Software QA Engineer",
  "Test Automation Engineer",
  "Data Quality Engineer",
  "Data Quality Analyst",
]
results_per_query = 25
